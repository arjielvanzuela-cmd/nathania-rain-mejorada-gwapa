<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hi Bossing! ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e1b4b;
      --accent: #f43f5e;
      --accent-2: #8b5cf6;
      --gold: #fbbf24;
      --card-bg: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top left, var(--bg-2), var(--bg-1));
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #fff;
      overflow: hidden;
      position: relative;
    }

    /* Interactive Canvas Background */
    #particle-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Main Glass Card */
    .card {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 460px;
      padding: 2.5rem 2rem;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      transition: transform 0.15s ease-out;
    }

    .emoji-badge {
      font-size: 4rem;
      display: inline-block;
      margin-bottom: 0.75rem;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3));
    }

    .emoji-badge:hover {
      transform: scale(1.25) rotate(12deg);
    }

    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.5rem;
      background: linear-gradient(135deg, #fff 30%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      font-size: 1.05rem;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 1.75rem;
      min-height: 3.2em;
    }

    /* Interactive Vibe Meter */
    .vibe-box {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 16px;
      padding: 1rem;
      margin-bottom: 1.75rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .vibe-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 25%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--gold));
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Buttons */
    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      position: relative;
    }

    button {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      padding: 0.85rem 1.6rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      box-shadow: 0 10px 20px -5px rgba(244, 63, 94, 0.5);
    }

    .btn-primary:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 15px 25px -5px rgba(244, 63, 94, 0.7);
    }

    .btn-primary:active {
      transform: scale(0.96);
    }

    .btn-dodge {
      background: rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Secret Unlocked Toast */
    .secret-msg {
      margin-top: 1.25rem;
      font-size: 0.95rem;
      color: var(--gold);
      font-weight: 600;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.4s ease;
    }

    .secret-msg.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <canvas id="particle-canvas"></canvas>

  <div class="card" id="tilt-card">
    <div class="emoji-badge" id="main-emoji" title="Click me!">🫡</div>
    <h1 id="main-title">Hi Bossing!</h1>
    <p class="subtitle" id="subtitle">Kamusta ang araw mo? Tap the button below to boost the energy!</p>

    <div class="vibe-box">
      <div class="vibe-label">
        <span>Energy Level</span>
        <span id="vibe-percent">25%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn-primary" id="boost-btn">⚡ Boost Energy</button>
      <button class="btn-dodge" id="dodge-btn">😴 Skip Today</button>
    </div>

    <div class="secret-msg" id="secret-msg">🔥 MAX LEVEL REACHED! Unstoppable ka na today, Bossing!</div>
  </div>

  <script>
    // --- 1. Interactive Messages & Progress ---
    const messages = [
      { emoji: "😎", title: "Hi Bossing!", text: "Looking sharp today! Keep tapping to charge up." },
      { emoji: "🚀", title: "Let's Gooo!", text: "Momentum is building! Walang makakapigil sa'yo." },
      { emoji: "🔥", title: "Solid Energy!", text: "Halfway to legendary status. Keep going!" },
      { emoji: "👑", title: "Certified Bossing!", text: "100% Charged! Ready to conquer everything today!" }
    ];

    const emojis = ["🫡", "😎", "🤩", "🥳", "🚀", "👑", "🔥", "✨"];
    let energy = 25;
    let step = 0;

    const boostBtn = document.getElementById("boost-btn");
    const dodgeBtn = document.getElementById("dodge-btn");
    const mainEmoji = document.getElementById("main-emoji");
    const mainTitle = document.getElementById("main-title");
    const subtitle = document.getElementById("subtitle");
    const progressFill = document.getElementById("progress-fill");
    const vibePercent = document.getElementById("vibe-percent");
    const secretMsg = document.getElementById("secret-msg");

    // Click Emoji to cycle faces
    mainEmoji.addEventListener("click", () => {
      const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
      mainEmoji.textContent = randomEmoji;
      spawnBurst(window.innerWidth / 2, window.innerHeight / 2, 15);
    });

    // Boost Button Click
    boostBtn.addEventListener("click", (e) => {
      energy = Math.min(100, energy + 25);
      step = Math.min(messages.length - 1, step + 1);

      progressFill.style.width = energy + "%";
      vibePercent.textContent = energy + "%";
      mainEmoji.textContent = messages[step].emoji;
      mainTitle.textContent = messages[step].title;
      subtitle.textContent = messages[step].text;

      spawnBurst(e.clientX, e.clientY, 30);

      if (energy === 100) {
        secretMsg.classList.add("show");
        boostBtn.textContent = "🎉 Celebrate Again!";
        spawnBurst(window.innerWidth / 2, window.innerHeight / 3, 60);
      }
    });

    // --- 2. Playful Runaway Button ---
    function moveDodgeButton() {
      const x = (Math.random() - 0.5) * 220;
      const y = (Math.random() - 0.5) * 160;
      dodgeBtn.style.transform = `translate(${x}px, ${y}px)`;
      dodgeBtn.textContent = "😜 Bawal mag-skip!";
    }
    dodgeBtn.addEventListener("mouseover", moveDodgeButton);
    dodgeBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveDodgeButton();
    });

    // --- 3. 3D Card Tilt Effect ---
    const card = document.getElementById("tilt-card");
    document.addEventListener("mousemove", (e) => {
      const xAxis = (window.innerWidth / 2 - e.pageX) / 28;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 28;
      card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });

    // --- 4. Interactive Particle & Confetti Canvas ---
    const canvas = document.getElementById("particle-canvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, burst = false) {
        this.x = x ?? Math.random() * canvas.width;
        this.y = y ?? Math.random() * canvas.height;
        this.size = burst ? Math.random() * 6 + 3 : Math.random() * 3 + 1;
        this.speedX = burst ? (Math.random() - 0.5) * 10 : (Math.random() - 0.5) * 0.8;
        this.speedY = burst ? (Math.random() - 0.5) * 10 : (Math.random() - 0.5) * 0.8;
        const colors = ["#f43f5e", "#8b5cf6", "#fbbf24", "#38bdf8", "#ffffff"];
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.alpha = 1;
        this.decay = burst ? 0.02 : 0;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.decay > 0) {
          this.alpha -= this.decay;
        } else {
          if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
          if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Ambient floating particles
    for (let i = 0; i < 45; i++) {
      particles.push(new Particle());
    }

    function spawnBurst(x, y, count) {
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, true));
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => p.alpha > 0);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
